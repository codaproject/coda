name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Run tests
      run: |
        pytest tests/ -v

  mac-lock:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v6

    - name: Check that the Mac lock matches pyproject.toml
      run: |
        uv pip compile pyproject.toml --extra mac --extra indic-conformer \
          --python-version 3.12 --python-platform aarch64-apple-darwin \
          -o mac/requirements.lock -q
        git diff --exit-code mac/requirements.lock || {
          echo "::error::mac/requirements.lock is out of date, regenerate it as in mac/README.md"
          exit 1
        }
