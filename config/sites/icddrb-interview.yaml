# icddr,b community deaths, mostly children, interviews by field workers in Bangla

app:
  tls: true
  show_mccd: true
  show_cod_result: true
  ui_language: bn

inference:
  llm:
    provider: ollama
    model: qwen3:30b-a3b-instruct-2507-q4_K_M
  champs_prompted:
    cohort: child
    coding: icd11

translate:
  backend: madlad
  model: madlad400-3b-mt

dialogue:
  language: bn
  transcriber_backend: indic-conformer

storage:
  enabled: true
