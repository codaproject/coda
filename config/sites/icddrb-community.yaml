# icddr,b community deaths, mostly children, interviews by field workers in Bangla

app:
  tls: true
  show_clinical_note: false
  show_mccd: true
  show_cod_result: true
  ui_language: en

inference:
  num_questions: 3
  question_style: simplified
  llm:
    provider: ollama
    model: qwen3:30b-a3b-instruct-2507-q4_K_M
  champs_prompted:
    population: child
    coding: icd11

dialogue:
  language: bn
  transcriber_backend: indic-conformer

storage:
  enabled: true
