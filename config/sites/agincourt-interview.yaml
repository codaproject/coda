# Agincourt community deaths, mostly adults, interviews by field workers in
# Xitsonga, with the screen in Xitsonga

app:
  tls: true
  ui_language: ts

inference:
  llm:
    provider: ollama
    model: qwen3:30b-a3b-instruct-2507-q4_K_M
  champs_prompted:
    cohort: adult
    coding: icd11

translate:
  backend: ctranslate2
  model: nllb-1.3b

dialogue:
  language: ts
  transcriber_model: anv-tso-turbo
  whisper_livekit:
    backend: mlx-whisper

storage:
  enabled: true
