# Wits VIDA family interviews at the facility, mostly children, by grief
# counsellors in English, isiZulu or Sesotho

app:
  tls: true
  show_cod_result: true
  ui_language: en

inference:
  llm:
    provider: ollama
    model: qwen3:30b-a3b-instruct-2507-q4_K_M
  champs_prompted:
    cohort: child
    coding: icd11

translate:
  backend: ctranslate2
  model: nllb-1.3b

dialogue:
  language: en
  transcriber_model: large-v3-turbo
  whisper_livekit:
    backend: mlx-whisper
  language_transcribers:
    zu:
      model: anv-zul-turbo
    st:
      model: anv-sot-turbo

storage:
  enabled: true
