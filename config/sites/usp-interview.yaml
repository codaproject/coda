# USP family interviews at the hospital and in the community, children and
# adults, by nurses and field workers in Portuguese

app:
  tls: true
  show_cod_result: true
  ui_language: pt

inference:
  question_selection: voi
  question_region:
    hiv: low
    malaria: very_low
  llm:
    provider: ollama
    model: qwen3:30b-a3b-instruct-2507-q4_K_M
  champs_prompted:
    cohort: child
    coding: icd11

translate:
  backend: madlad
  model: madlad400-3b-mt

dialogue:
  language: pt
  transcriber_model: large-v3-turbo
  whisper_livekit:
    backend: mlx-whisper

storage:
  enabled: true
