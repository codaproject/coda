# USP facility deaths, children and adults, entered by clinicians and nurses, in Portuguese

app:
  tls: true
  show_mccd: false
  ui_language: pt

inference:
  llm:
    provider: ollama
    model: qwen3:30b-a3b-instruct-2507-q4_K_M
  champs_prompted:
    cohort: child
    coding: icd11

translate:
  backend: madlad
  model: madlad400-3b-mt

dialogue:
  language: pt
  transcriber_model: large-v3-turbo
  whisper_livekit:
    backend: mlx-whisper

storage:
  enabled: true
